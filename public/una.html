<!doctype html>
<html>

<head>
  <title>
    Una
  </title>
</head>

<body>

    <a href="/pages/vocabreview.html">
    start vocab review
  </a>
  
    <div id="vocab">
    <h1>
      vocab: read all
    </h1>

    <button id="getVocab">
      get vocab
    </button>

    <p id="messageVocab"></p>

    <ul id="listVocab"></ul>

    <script>

      document
        .querySelector('#getVocab')
        .addEventListener(
          'click',
          getVocab
        );

      async function getVocab() {

        const response =
          await fetch(
            '/api/vocab'
          );

        const data =
          await response.json();

        const list =
          document
            .querySelector('#listVocab');

        list.textContent = '';

        data.forEach(function (word) {

          const item =
            document
              .createElement('li');

          item.textContent =
            word.german +
            ' = ' +
            word.english +
            ' ';

          const button =
            document
              .createElement('button');

          button.textContent = 'save';

          button.addEventListener(
            'click',
            function () {
              saveItem(
                'vocab',
                word._id,
                '#messageVocab'
              );
            }
          );

          item.appendChild(button);
          list.appendChild(item);

        });

      }

      async function saveItem(itemType, itemId, messageSelector) {

        const save = {
          itemType: itemType,
          itemId: itemId
        };

        const response =
          await fetch(
            '/api/saves',
            {
              method:
                'POST',
              headers: {
                'Content-Type':
                  'application/json'
              },
              body:
                JSON.stringify(
                  save
                )
            }
          );

        let message = 'error ' + response.status;

        if (response.status === 201) {
          message = 'saved';
        }

        if (response.status === 409) {
          message = 'already saved';
        }

        document
          .querySelector(messageSelector)
          .textContent = message;

      }

    </script>
  </div>

    <div id="grammar">
    <hr>
    <h1>
      grammar: read all
    </h1>

    <button id="getGrammar">
      get grammar
    </button>

    <p id="messageGrammar"></p>

    <ul id="listGrammar"></ul>

    <script>

      document
        .querySelector('#getGrammar')
        .addEventListener(
          'click',
          getGrammar
        );

      async function getGrammar() {

        const response =
          await fetch(
            '/api/grammar'
          );

        const data =
          await response.json();

        const list =
          document
            .querySelector('#listGrammar');

        list.textContent = '';

        data.forEach(function (concept) {

          const item =
            document
              .createElement('li');

          item.textContent =
            concept.title +
            ': ' +
            concept.summary +
            ' ';

          const button =
            document
              .createElement('button');

          button.textContent = 'save';

          button.addEventListener(
            'click',
            function () {
              saveItem(
                'grammar',
                concept._id,
                '#messageGrammar'
              );
            }
          );

          item.appendChild(button);
          list.appendChild(item);

        });

      }

    </script>
  </div>

    <div id="review">
    <hr>
    <h1>
      my review
    </h1>

    <p>
      1 = still learning, 2 = getting there, 3 = know it
    </p>

    <button id="getSaves">
      get saves
    </button>

    <p id="messageReview"></p>

    <ul id="listSaves"></ul>

    <script>

      document
        .querySelector('#getSaves')
        .addEventListener(
          'click',
          getSaves
        );

      async function getSaves() {

        const response =
          await fetch(
            '/api/saves'
          );

        const data =
          await response.json();

        const list =
          document
            .querySelector('#listSaves');

        list.textContent = '';

        document
          .querySelector('#messageReview')
          .textContent =
          data.length === 0
            ? 'nothing saved yet'
            : '';

        data.forEach(function (save) {

          let label = '(this item no longer exists)';

          if (save.item && save.itemType === 'vocab') {
            label = save.item.german + ' = ' + save.item.english;
          }

          if (save.item && save.itemType === 'grammar') {
            label = save.item.title;
          }

          const item =
            document
              .createElement('li');

          item.textContent =
            label +
            ' (confidence ' +
            save.confidence +
            ', reviewed ' +
            save.reviewCount +
            ' times) ';

          [1, 2, 3].forEach(function (confidence) {

            const button =
              document
                .createElement('button');

            button.textContent = confidence;

            button.addEventListener(
              'click',
              function () {
                reviewSave(
                  save._id,
                  confidence
                );
              }
            );
          const unsave =
            document
              .createElement('button');

          unsave.textContent = 'unsave';

          unsave.addEventListener(
            'click',
            function () {
              unsaveItem(
                save._id
              );
            }
          );

          item.appendChild(unsave);
            item.appendChild(button);

          });

          list.appendChild(item);

        });

      }

      async function reviewSave(saveId, confidence) {

        const review = {
          confidence: confidence
        };

        const response =
          await fetch(
            `/api/saves/${saveId}/review`,
            {
              method:
                'PATCH',
              headers: {
                'Content-Type':
                  'application/json'
              },
              body:
                JSON.stringify(
                  review
                )
            }
          );

        await getSaves();

        document
          .querySelector('#messageReview')
          .textContent =
          response.status === 200
            ? 'reviewed'
            : 'error ' + response.status;

      }

            async function unsaveItem(saveId) {

        const response =
          await fetch(
            `/api/saves/${saveId}`,
            {
              method:
                'DELETE'
            }
          );

        await getSaves();

        document
          .querySelector('#messageReview')
          .textContent =
          response.status === 200
            ? 'unsaved'
            : 'error ' + response.status;

      }

    </script>
  </div>
</body>

</html>
