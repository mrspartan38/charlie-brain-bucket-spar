<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <title>
    Una: manage grammar
  </title>
</head>

<body>
  <div id="admin">
    <h1>
      manage grammar
    </h1>

    <p id="messageAdmin"></p>

    <div id="adminBody" hidden>
      <h2 id="formHeading">
        add a concept
      </h2>

      <form id="conceptForm" novalidate>
        <input type="hidden" id="conceptId">

        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="title">Title (required)</label>
            <input class="form-control" id="title" autocomplete="off">
          </div>

          <div class="col-12">
            <label class="form-label" for="summaryLine">Summary, one sentence (required)</label>
            <input class="form-control" id="summaryLine" autocomplete="off">
          </div>

          <div class="col-12">
            <label class="form-label" for="explanation">Explanation (required)</label>
            <textarea class="form-control" id="explanation" rows="5"></textarea>
          </div>

          <div class="col-md-4">
            <label class="form-label" for="book">Book</label>
            <input class="form-control" id="book" value="GR101" autocomplete="off">
          </div>

          <div class="col-md-4">
            <label class="form-label" for="chapter">Chapter</label>
            <input class="form-control" id="chapter" type="number" min="1" autocomplete="off">
          </div>

          <div class="col-md-4">
            <label class="form-label" for="level">Level (required)</label>
            <select class="form-select" id="level">
              <option value="100">100</option>
              <option value="200">200</option>
              <option value="300">300</option>
              <option value="400">400</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label" for="tags">Tags (separated by commas)</label>
            <input class="form-control" id="tags" autocomplete="off">
          </div>
        </div>

        <h3 class="h5 mt-4">
          examples
        </h3>

        <div id="exampleRows"></div>

        <button type="button" id="addExample">add an example</button>

        <div class="mt-3">
          <button type="submit" id="saveConcept">add concept</button>
          <button type="button" id="cancelEdit" hidden>cancel</button>
        </div>
      </form>

      <h2 class="mt-4">
        concepts
      </h2>

      <div id="listGrammar"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/session.js"></script>
  <script src="/assets/js/admin-grammar.js"></script>
</body>

</html>
