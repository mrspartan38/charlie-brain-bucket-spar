<html>

  <link rel="stylesheet" href="/assets/css/style.css">
  <title>

<body>
  <div id="dictionary">
    <h1>
      dictionary
    </h1>

    <form id="dictForm" class="d-flex gap-2 mb-3" role="search" novalidate>

      <button type="submit">search</button>

    <p id="messageDict"></p>

    <ul id="listVocab"></ul>
  </div>

  <script src="/assets/js/dictionary.js"></script>
