<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<html>

<head>
  <title>
    Una: vocab review
  </title>
</head>

<body>
  <div id="review">
  <h1>
    vocab review
  </h1>

  <p id="sessionCount">
    Reviewed 0 words
  </p>

  <button id="endSession">
    end session
  </button>

  <p id="messageCard"></p>

  <div id="card" hidden>
    <h2 id="cardGerman"></h2>

    <button id="showAnswer">
      show answer
    </button>

    <div id="cardAnswer" hidden>
      <p id="cardEnglish"></p>
      <p id="cardPlural"></p>
      <p id="cardExample"></p>

      <p>
        1 = still learning, 2 = getting there, 3 = know it
      </p>

      <button id="rate1">1</button>
      <button id="rate2">2</button>
      <button id="rate3">3</button>
    </div>
  </div>
  </div>

  <div id="summary" hidden>
    <h2>
      session finished
    </h2>

    <p id="summaryText"></p>

    <button id="reviewAgain">
      review again
    </button>
  </div>

  <script>



    let currentSaveId = null;
    let reviewedCount = 0;

    document
      .querySelector('#showAnswer')
      .addEventListener(
        'click',
        showAnswer
      );

    document.querySelector('#rate1').addEventListener('click', function () { rate(1); });
    document.querySelector('#rate2').addEventListener('click', function () { rate(2); });
    document.querySelector('#rate3').addEventListener('click', function () { rate(3); });

    document
      .querySelector('#endSession')
      .addEventListener(
        'click',
        endSession
      );

    document
      .querySelector('#reviewAgain')
      .addEventListener(
        'click',
        reviewAgain
      );

    async function loadNext() {

      const response =
        await fetch(
          '/api/review/next?itemType=vocab'
        );

      if (response.status === 401) {
        document.querySelector('#card').hidden = true;
        document.querySelector('#messageCard').textContent =
          'Log in to review your saved words.';
        return;
      }

      const data =
        await response.json();

      if (data.done || !data.item) {
        document.querySelector('#card').hidden = true;
        document.querySelector('#messageCard').textContent =
          'Nothing to review. Save some words on the main page first.';
        return;
      }

      currentSaveId = data._id;

      document.querySelector('#messageCard').textContent = '';
      document.querySelector('#cardGerman').textContent = data.item.german;
      document.querySelector('#cardEnglish').textContent = data.item.english;

      document.querySelector('#cardPlural').textContent =
        data.item.plural
          ? 'Plural: ' + data.item.plural
          : '';

      document.querySelector('#cardExample').textContent =
        data.item.example
          ? data.item.example.german + ' (' + data.item.example.english + ')'
          : '';

      document.querySelector('#cardAnswer').hidden = true;
      document.querySelector('#showAnswer').hidden = false;
      document.querySelector('#card').hidden = false;

    }

    function showAnswer() {

      document.querySelector('#cardAnswer').hidden = false;
      document.querySelector('#showAnswer').hidden = true;

    }

    async function rate(confidence) {

      const response =
        await fetch(
          `/api/saves/${currentSaveId}/review`,
          {
            method:
              'PATCH',
            headers: {
              'Content-Type':
                'application/json'
            },
            body:
              JSON.stringify({
                confidence: confidence
              })
          }
        );

      if (response.status !== 200) {
        document.querySelector('#messageCard').textContent =
          'error ' + response.status;
        return;
      }

      reviewedCount = reviewedCount + 1;

      document
        .querySelector('#sessionCount')
        .textContent =
        'Reviewed ' +
        reviewedCount +
        (reviewedCount === 1 ? ' word' : ' words');

      loadNext();

    }

    function endSession() {

      document.querySelector('#card').hidden = true;
      document.querySelector('#messageCard').textContent = '';
      document.querySelector('#endSession').hidden = true;

      document
        .querySelector('#summaryText')
        .textContent =
        'You reviewed ' +
        reviewedCount +
        (reviewedCount === 1 ? ' word.' : ' words.');

      document.querySelector('#summary').hidden = false;

    }

    function reviewAgain() {

      reviewedCount = 0;

      document
        .querySelector('#sessionCount')
        .textContent = 'Reviewed 0 words';

      document.querySelector('#summary').hidden = true;
      document.querySelector('#endSession').hidden = false;

      loadNext();

    }


    loadNext();

  </script>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/session.js"></script>
</body>

</html>
