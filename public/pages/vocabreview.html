<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <title>
    Una: vocab review
  </title>
</head>

<body>
  <div id="review">
    <h1>
      vocab review
    </h1>

    <p id="messageCard"></p>

    <div id="controls" class="row g-3 mb-3" hidden>
      <div class="col-sm-6">
        <label class="form-label" for="deckSelect">Deck</label>
        <select class="form-select" id="deckSelect"></select>
      </div>

      <div class="col-sm-6">
        <label class="form-label" for="direction">Show first</label>
        <select class="form-select" id="direction">
          <option value="de-en">German (guess the English)</option>
          <option value="en-de">English (guess the German)</option>
        </select>
      </div>
    </div>

    <div id="deckArea" hidden>
      <p id="progressText" aria-live="polite"></p>

      <div class="progress" role="progressbar" aria-label="Deck progress" aria-valuemin="0" aria-valuemax="100" id="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="fc-scene">
        <div class="fc-card" id="flashcard" role="button" tabindex="0" aria-pressed="false">
          <div class="fc-face fc-front" id="faceFront">
            <p class="fc-hint" id="frontHint"></p>
            <p class="fc-word" id="frontWord"></p>
            <p class="fc-hint">click the card or press space to flip</p>
          </div>

          <div class="fc-face fc-back" id="faceBack" aria-hidden="true">
            <p class="fc-hint" id="backHint"></p>
            <p class="fc-word" id="backWord"></p>
            <p id="backPlural"></p>
            <p id="backExample"></p>
          </div>
        </div>
      </div>

      <div id="rating" class="text-center" hidden>
        <p>
          How well did you know it? (keys 1, 2, 3)
        </p>

        <button type="button" data-rating="1">1 still learning</button>
        <button type="button" data-rating="2">2 getting there</button>
        <button type="button" data-rating="3">3 know it</button>
      </div>
    </div>

    <div id="summary" hidden>
      <h2>
        deck finished
      </h2>

      <p id="summaryText"></p>
      <p id="summaryWeak"></p>

      <button type="button" id="reviewAgain">
        review again
      </button>

      <a href="/pages/saves.html">my saves</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/session.js"></script>
  <script src="/assets/js/flashcards.js"></script>
</body>

</html>
