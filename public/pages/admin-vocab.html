<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <title>
    Una: manage vocabulary
  </title>
</head>

<body>
  <div id="admin">
    <h1>
      manage vocabulary
    </h1>

    <p id="messageAdmin"></p>

    <div id="adminBody" hidden>
      <h2 id="formHeading">
        add a word
      </h2>

      <form id="wordForm" novalidate>
        <input type="hidden" id="wordId">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="german">German (required)</label>
            <input class="form-control" id="german" autocomplete="off">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="english">English (required)</label>
            <input class="form-control" id="english" autocomplete="off">
          </div>

          <div class="col-md-4">
            <label class="form-label" for="partOfSpeech">Part of speech (required)</label>
            <select class="form-select" id="partOfSpeech">
              <option value="noun">noun</option>
              <option value="verb">verb</option>
              <option value="adjective">adjective</option>
              <option value="adverb">adverb</option>
              <option value="phrase">phrase</option>
              <option value="other">other</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label" for="article">Article (nouns only)</label>
            <select class="form-select" id="article">
              <option value="">none</option>
              <option value="der">der</option>
              <option value="die">die</option>
              <option value="das">das</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label" for="plural">Plural</label>
            <input class="form-control" id="plural" autocomplete="off">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="exampleGerman">Example sentence (German)</label>
            <input class="form-control" id="exampleGerman" autocomplete="off">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="exampleEnglish">Example sentence (English)</label>
            <input class="form-control" id="exampleEnglish" autocomplete="off">
          </div>

          <div class="col-md-4">
            <label class="form-label" for="book">Book</label>
            <input class="form-control" id="book" value="GR101" autocomplete="off">
          </div>

          <div class="col-md-4">
            <label class="form-label" for="chapter">Chapter</label>
            <input class="form-control" id="chapter" type="number" min="1" autocomplete="off">
          </div>

          <div class="col-md-4">
            <label class="form-label" for="level">Level (required)</label>
            <select class="form-select" id="level">
              <option value="100">100</option>
              <option value="200">200</option>
              <option value="300">300</option>
              <option value="400">400</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label" for="tags">Tags (separated by commas)</label>
            <input class="form-control" id="tags" autocomplete="off">
          </div>
        </div>

        <div class="mt-3">
          <button type="submit" id="saveWord">add word</button>
          <button type="button" id="cancelEdit" hidden>cancel</button>
        </div>
      </form>

      <h2 class="mt-4">
        words
      </h2>

      <ul id="listVocab"></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/session.js"></script>
  <script src="/assets/js/admin-vocab.js"></script>
</body>

</html>
