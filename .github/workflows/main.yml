name: re-deploy-main-to-gcp.yml

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_THREE_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          # safer than StrictHostKeyChecking=no
          # ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh-keyscan -H "34.55.74.112" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          
      - name: Debug secret (safe)
        shell: bash
        run: |
          echo "Secret length: ${#KEY}"
          echo "First 20 chars of decoded key:"
          echo "$KEY" | base64 -d | head -c 20
          echo
        env:
          KEY: ${{ secrets.SSH_THREE_KEY }}
          
      - name: Deploy over SSH
        shell: bash
        env:
          SSH_USER: mrspartan38 #${{ secrets.SSH_USER }}
          SSH_HOST: 34.55.74.112 #${{ secrets.SSH_HOST }}
          APP_DIR:  app/server # ${{ vars.APP_DIR }}
          PM2_NAME: app # ${{ vars.PM2_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -T "$SSH_USER@$SSH_HOST" <<EOF
            set -e

            cd "$APP_DIR"
          
            git pull
            npm ci
            pm2 restart "$PM2_NAME" || pm2 start app.js --name "$PM2_NAME"
            
            pm2 save
          EOF
